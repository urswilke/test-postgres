name: R with PostgreSQL

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: TabBooks
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      
      - name: Install system dependencies
        run: |
          apt-get -y update
          apt-get install --yes --no-install-recommends postgresql-client
          apt-get install --yes r-base r-base-dev r-cran-dbi unixodbc unixodbc-dev odbc-postgresql libcurl4-openssl-dev libpq-dev

      - name: run psql
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -h postgres -U postgres -f test-code.sql 
          psql -h postgres -U postgres -c 'SELECT * FROM public."Book";'
        working-directory: ./SQL

      - name: Install R packages
        run: |
          install.packages(c("DBI", "RPostgres"))
        shell: Rscript {0}
      
      - name: Test PostgreSQL connection
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: TabBooks
        run: |
          library(DBI)
          Sys.sleep(2)
          con <- dbConnect(
            RPostgres::Postgres(),
            host = Sys.getenv("PGHOST"),
            port = 5432,
            user = Sys.getenv("PGUSER"),
            password = Sys.getenv("PGPASSWORD"),
            dbname = Sys.getenv("PGDATABASE")
          )
          result <- dbGetQuery(con, 'SELECT * FROM public."Book";')
          print(result)
          dbDisconnect(con)
        shell: Rscript {0}