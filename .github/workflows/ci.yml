name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: docker compose pull db

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up db -d

      - name: Wait for PostgreSQL to be ready
        run: timeout 30s bash -c 'until docker compose exec -T db pg_isready; do sleep 1; done'

      - name: install packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
          sudo apt-get install r-base r-base-dev r-cran-tidyverse r-cran-dbi unixodbc unixodbc-dev odbc-postgresql libcurl4-openssl-dev


      - name: run psql
        env:
          PGHOST: 127.0.0.1 # <--- Forces TCP connection instead of Unix socket
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -U postgres -f test-code.sql 
          psql -U postgres -c 'SELECT * FROM public."Book";'
        working-directory: ./SQL

      - name: run R
        run: |
          Rscript -e 'dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE); .libPaths(Sys.getenv("R_LIBS_USER")); install.packages("pak"); pak::pak("odbc")'
          Rscript -e 'conn <- DBI::dbConnect(odbc::odbc(), dsn = "TabBooks"); "SELECT * FROM public.\"Book\"" |> DBI::dbGetQuery(conn, statement = _)'
