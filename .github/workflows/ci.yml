name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: docker compose pull db

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up db -d

      - name: Wait for PostgreSQL to be ready
        run: timeout 30s bash -c 'until docker compose exec -T db pg_isready; do sleep 1; done'

      - name: install psql
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: run psql
        env:
          PGHOST: 127.0.0.1 # <--- Forces TCP connection instead of Unix socket
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -U postgres -c 'CREATE TABLE public."Book" ("BookNo" integer NOT NULL, "Version" text NOT NULL, "Language" integer NOT NULL, "ProjectName" text NOT NULL, "BookName" text NOT NULL, "Scenario" integer NOT NULL, "ScenName" text NOT NULL, "ColVar" text NOT NULL, "Weight" text, "Parameter" text, "Productive" timestamp without time zone);'
